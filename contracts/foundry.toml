[profile.default]
src = "src"
out = "out"
libs = ["lib", "node_modules"]
test = "test"
script = "script"
solc_version = "0.8.27"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
ffi = true
fs_permissions = [{ access = "read-write", path = "./" }]

# forge-fhevm intercepts FHE op events via vm.getRecordedLogs(); tests must record logs.
# See lib/forge-fhevm/README.md and docs/.
